<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>FORGE</title>
<meta name="description" content="FORGE — 800m Performance System">
<meta name="theme-color" content="#030303">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORGE">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png?v=forge-v110">
<link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png?v=forge-v110">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=forge-v110">
<link rel="stylesheet" href="./styles.css">
<!--
  iOSの起動画像。
  iOSはmanifestのbackground_colorを見ない（あれはAndroid/Chrome用）ので、
  これが無いとコールド起動のあいだ**白い画面**が出る。
  サイズが完全一致したときだけ使われるため、機種ごとに1枚ずつ要る。
  生成は scripts/build-splash-screens.mjs（実物のスプラッシュを撮っている）。
-->
<link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash-1320x2868.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash-1290x2796.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash-1206x2622.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash-1179x2556.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash-1284x2778.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash-1170x2532.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash-1125x2436.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash-1242x2688.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="./splash-828x1792.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash-1242x2208.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="./splash-750x1334.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="./splash-640x1136.png">
<style>
  :root { --forge: #b6ff00; --muted: #6b7280; --muted-2: #9ca3af; }
  html, body { margin: 0; min-height: 100%; background: #030303; color: #fff; }
  #splash {
    position: fixed; inset: 0; z-index: 99; display: grid; place-items: center;
    overflow: hidden; box-sizing: border-box;
    padding: calc(env(safe-area-inset-top, 0px) + 22px) 22px
      calc(env(safe-area-inset-bottom, 0px) + 22px);
    /* 緑のにじみはトラック演出の一部だったので、演出と一緒に外して黒一色にした */
    background: #030303;
    font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Hiragino Sans",
      "Noto Sans JP", "Yu Gothic UI", sans-serif;
    transition: opacity 280ms ease;
  }
  #splash[data-leaving="1"] { opacity: 0; pointer-events: none; }
  #splash .inner {
    width: min(100%, 620px); display: flex; flex-direction: column;
    align-items: center; text-align: center;
  }
  /*
   * ロード表示は細い線と3つの点だけ。
   *
   * 以前は400mトラックを1.45秒かけて描き、ゴールにフレアを出す演出だった。
   * 毎日開く道具に2.5秒の見せ場を毎回入れるのは重い。
   * 線は「ここまでが読み込みの枠」、点は「まだ生きている」ことだけを示す。
   * 主役は下に出るレースまでの日数と目標との差（R-2）に戻す。
   */
  #splash .loader {
    margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 13px;
  }
  #splash .loader .bar {
    width: min(38vw, 172px); height: 2px; border-radius: 1px;
    background: rgba(255,255,255,.20);
  }
  #splash .loader .dots { display: flex; gap: 15px; }
  /*
   * 点は2層。下に消灯色、上に緑を重ねて**上の層のopacityだけ**動かす。
   *
   * 最初は1層で background の色を動かしていたが、色のアニメーションは
   * コンポジタに乗らず、毎フレーム、メインスレッドでの描き直しが要る。
   * ところがこの画面が出ている最中のメインスレッドは、1MB近い bundle.js の
   * 解析と最初の描画で埋まっている。結果、点だけがカクついた。
   * opacity なら合成側で回るので、メインスレッドが詰まっていても滑らかに動く。
   */
  #splash .loader .dots i {
    position: relative; width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255,255,255,.16);
  }
  #splash .loader .dots i::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: var(--forge); opacity: 0;
    will-change: opacity;
    animation: splash-dot 1.35s ease-in-out infinite;
  }
  #splash .loader .dots i:nth-child(2)::after { animation-delay: .18s; }
  #splash .loader .dots i:nth-child(3)::after { animation-delay: .36s; }
  /*
   * 以前は軌跡とワードマークを負マージンで重ねていた。その軌跡を無くしたので
   * 通常配置に戻す。出だしの遅延も、トラックが描き終わるのを待つための
   * 1.78秒から詰めた。
   */
  #splash .brand {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    opacity: 0; transform: translateY(12px);
    animation: splash-rise 420ms ease-out .12s forwards;
  }
  /*
   * ワードマークは画像をマスクとして使う。
   * 斜体をかけた普通のテキストでは、リファレンスの幅広・角落としの字形にならない。
   * url() は index.html と同じ場所を基準に解決される（brand-wordmark.png は
   * build-static.mjs が pwa-dist へコピーし、sw.js の ASSETS にも入れてある）。
   */
  /* 目には見せないが、読み上げとテキストとしては残す */
  #splash .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px;
    padding: 0; overflow: hidden; white-space: nowrap; border: 0;
    clip-path: inset(50%);
  }
  #splash .wm {
    /*
     * ロゴを差し替えるたびに縦横比が変わるので、幅もそのつど見直す。
     *   1120x205（比5.46）→ 1012x366（比2.77）→ 1124x918（比1.22）
     * 今回はほぼ正方形になったので、幅を360pxのままにすると高さが約3倍になる。
     * 260pxで高さ約212px。
     *
     * 画像はマスクではなくそのまま出す（緑の縦線がロゴの一部のため）。
     */
    display: block; width: min(52vw, 260px); aspect-ratio: 1124 / 918;
    background: url("./brand-wordmark.png") no-repeat center / contain;
  }
  #splash .tag {
    margin-top: 12px; color: var(--muted-2); font-size: clamp(8px,2.5vw,11px);
    font-weight: 700; letter-spacing: .34em;
  }
  #splash .info {
    min-height: 96px; margin-top: 26px; display: flex; flex-direction: column;
    align-items: center; opacity: 0; animation: splash-rise 420ms ease-out .42s forwards;
  }
  #splash .label {
    color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .18em;
  }
  #splash .value {
    max-width: min(88vw,560px); margin-top: 5px; color: #fff;
    font-size: clamp(28px,10vw,48px); line-height: 1.08; letter-spacing: -.045em;
    font-weight: 850; font-variant-numeric: tabular-nums;
  }
  #splash .sub {
    margin-top: 8px; color: var(--forge); font-size: clamp(11px,3.4vw,14px);
    font-weight: 750; font-variant-numeric: tabular-nums;
  }
  #splash .wait {
    min-height: 16px; margin-top: 18px; color: var(--muted); font-size: 10px;
    letter-spacing: .08em; animation: splash-pulse 1.4s ease-in-out infinite;
  }
  #splash .retry {
    display: none; min-width: 150px; min-height: 44px; margin-top: 14px;
    border: 1px solid rgba(182,255,0,.45); border-radius: 10px;
    background: transparent; color: var(--forge); font: inherit; font-size: 12px; font-weight: 800;
  }
  #splash[data-stalled="1"] .retry, #splash[data-error="1"] .retry { display: block; }
  @keyframes splash-rise { to { opacity: 1; transform: translateY(0); } }
  @keyframes splash-pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  /* 3つの点を順に光らせる。1周ぶんの点灯は短く、大半は消えている */
  @keyframes splash-dot {
    0%, 60%, 100% { opacity: 0; }
    25% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    #splash { transition-duration: 120ms; }
    #splash .brand, #splash .info, #splash .wait, #splash .loader .dots i::after {
      animation: none !important;
    }
    #splash .brand, #splash .info { opacity: 1; transform: none; }
    /* 動かさない代わりに、生きていることは先頭の点の色で示す */
    #splash .loader .dots i:first-child::after { opacity: 1; }
  }
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite" aria-busy="true" aria-label="FORGEを起動しています">
  <div class="inner">
    <div class="brand">
      <span class="wm" aria-hidden="true"></span>
      <!--
        画像にした結果、文字としての「FORGE」が画面から消える。
        読み上げと自動確認のために本物のテキストを残す。
      -->
      <span class="sr-only">FORGE</span>
      <span class="tag">800M PERFORMANCE</span>
    </div>
    <!-- 読み込み表示。状態は下の info が文字で出すので、ここは装飾扱いにする -->
    <div class="loader" aria-hidden="true">
      <span class="bar"></span>
      <span class="dots"><i></i><i></i><i></i></span>
    </div>
    <div class="info" id="splash-info">
      <span class="label" id="splash-label">INITIALIZING</span>
      <strong class="value" id="splash-value">データ読込中</strong>
      <span class="sub" id="splash-sub">端末内の情報を確認しています</span>
    </div>
    <span class="wait" id="splash-wait">アプリを準備しています</span>
    <button class="retry" id="splash-retry" type="button">再読み込み</button>
  </div>
</div>
<script>
  (function () {
    var bornAt = Date.now();
    var reduced = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    /*
     * 最低表示時間。
     *
     * 元は2800msで、400mトラックを描く演出（1.45秒の描画＋1.68秒のフレア）を
     * 途中で切らないための値だった。演出を線と点に変えたとき1200msまで詰めたが、
     * 今度は速すぎて何が出ていたのか分からなかった。
     *
     * 2000msにする。内訳は、ワードマークと情報が出そろうのが約0.85秒
     * （0.42秒の遅延＋0.42秒のフェード）で、そこから約1.15秒は動かない画面が残る。
     * 点の点滅は1周1.35秒なので、1周半ぶん見えることになる。
     * 2800msに戻さないのは、演出を軽くした意味が消えるため。
     */
    var minimumMs = reduced ? 900 : 2000;
    var splash = document.getElementById("splash");
    var label = document.getElementById("splash-label");
    var value = document.getElementById("splash-value");
    var sub = document.getElementById("splash-sub");
    var wait = document.getElementById("splash-wait");
    var retry = document.getElementById("splash-retry");
    var ready = false;

    function daysUntil(date) {
      if (!date) return null;
      var now = new Date();
      var today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      var race = Date.parse(date + "T00:00:00Z");
      if (!isFinite(race)) return null;
      var days = Math.round((race - today) / 86400000);
      return days >= 0 ? days : null;
    }

    function renderSummary(data, loaded) {
      var days = daysUntil(data && data.raceDate);
      if (days !== null) {
        label.textContent = "レースまで";
        value.textContent = days + "日";
        sub.textContent = data.gapText || data.fallbackText || "目標を設定";
      } else if (data && data.fallbackText) {
        label.textContent = "CURRENT";
        value.textContent = data.fallbackText;
        sub.textContent = "目標レースを設定";
      } else if (loaded) {
        label.textContent = "NEXT RACE";
        value.textContent = "レース未設定";
        sub.textContent = "目標を設定";
      }
    }

    function hideWhenAllowed() {
      if (!ready || !splash) return;
      var rest = Math.max(0, minimumMs - (Date.now() - bornAt));
      window.setTimeout(function () {
        if (!splash) return;
        splash.setAttribute("data-leaving", "1");
        splash.setAttribute("aria-busy", "false");
        window.setTimeout(function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          splash = null;
        }, reduced ? 140 : 300);
      }, rest);
    }

    try {
      var raw = localStorage.getItem("forge:splash");
      if (raw) renderSummary(JSON.parse(raw), true);
    } catch (storageError) {
      wait.textContent = "保存情報を読み込めません。ローカル起動を続けます";
    }

    window.addEventListener("forge:splash-summary", function (event) {
      renderSummary(event.detail, true);
    });
    window.addEventListener("forge:app-ready", function () {
      ready = true;
      wait.textContent = navigator.onLine ? "準備完了" : "オフラインで起動";
      hideWhenAllowed();
    });
    window.addEventListener("forge:app-error", function (event) {
      splash.setAttribute("data-error", "1");
      splash.setAttribute("aria-busy", "false");
      label.textContent = "STARTUP ERROR";
      value.textContent = "起動できませんでした";
      sub.textContent = event.detail && event.detail.message
        ? event.detail.message
        : "再読み込みしてください";
      wait.textContent = navigator.onLine ? "接続と保存領域を確認してください" : "現在オフラインです";
    });
    window.addEventListener("offline", function () {
      if (!ready) wait.textContent = "オフラインデータを確認しています";
    });
    window.addEventListener("online", function () {
      if (!ready) wait.textContent = "接続が戻りました。初期化を続けています";
    });
    retry.addEventListener("click", function () { location.reload(); });

    window.setTimeout(function () {
      if (ready || !splash) return;
      wait.textContent = navigator.onLine
        ? "認証・保存データの読み込みを続けています"
        : "オフラインデータの読み込みを続けています";
    }, 4500);
    window.setTimeout(function () {
      if (ready || !splash) return;
      splash.setAttribute("data-stalled", "1");
      splash.setAttribute("aria-busy", "false");
      wait.textContent = "読み込みに時間がかかっています";
    }, 9000);
  })();
</script>
<div id="root"></div>
<script type="module" src="./bundle.js"></script>
</body>
</html>
